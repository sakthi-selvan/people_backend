name: people

services:
  api:
    build: .
    image: people-api:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4100"
      DATA_DIR: ./data
      JWT_SECRET: ${JWT_SECRET:-people-dev-secret-change-me}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-People <people@example.com>}
      SMTP_SECURE: ${SMTP_SECURE:-false}
    volumes:
      - people-data:/app/data
    expose:
      - "4100"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build: ../people_frontend
    image: people-web:local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_UPSTREAM: http://api:4100
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  people-data:
